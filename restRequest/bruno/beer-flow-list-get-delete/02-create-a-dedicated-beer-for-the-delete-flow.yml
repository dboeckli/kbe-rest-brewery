info:
  name: 2) create a dedicated beer for the delete flow (sets {{beerId}})
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:{{application-port}}/api/v1/beer
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
    - name: baggage
      value: testBaggage=kbe-rest-brewery
  body:
    type: json
    data: |-
      {
        "beerName": "delete-flow-beer",
        "beerStyle": "LAGER",
        "upc": "delete-flow",
        "quantityOnHand": 1,
        "price": 1.00
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const location = res.getHeader("Location");
        const beerId = location.substring(location.lastIndexOf("/") + 1);
        bru.setVar("beerId", beerId);
        console.log("Created beer id: " + beerId);

        test("createBeer returns 201", function () {
            expect(res.status === 201, "expected 201 but got " + res.status).to.be.true;
        });
        test("Location header contains a beer id", function () {
            expect(!!beerId, "beerId missing in Location header").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
